name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Rust and Windows resource compiler
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/rc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$rc) { throw "Windows SDK resource compiler not found" }
          "RC=$($rc.FullName)" >> $env:GITHUB_ENV
      - name: Check formatting, lint, and tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build portable executable
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pausic-windows-x64
          path: target/release/Pausic.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pausic-windows-x64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum Pausic.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" Pausic.exe SHA256SUMS.txt \
            --verify-tag --title "Pausic $RELEASE_TAG" --generate-notes \
            --notes "Portable Windows x64 tray app written in Rust. Pauses media while your microphone is in use, then resumes only the sessions it paused. Uses event-driven Windows Core Audio notifications and GSMTC. No periodic microphone polling. Download Pausic.exe below; no installer or separate runtime needed. See the README for usage, measurements, and compatibility."
